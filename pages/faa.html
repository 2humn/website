<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artwork Archive</title>
  <link href="../style.css" rel="stylesheet" type="text/css" media="all">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script>
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

  <script src="../theme.js"></script>
</head>

<body>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">✕</span>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <div class="header">
    <h1 id="logo"><a href="../index.html">Touhou Club of the University of Minnesota</a></h1>
    <ul class="nav-links">
      <li><a href="../index.html">About</a></li>
      <li><a href="faa.html">Art</a></li>
      <li><a href="events.html">Events</a></li>
    </ul>
  </div>

  <div class="page-layout">
    <main class="main gallery-main">
      <h2 class="hero-title">Artwork</h2>

      <div class="gallery-grid">

        <div class="gallery-item">
          <img src="../imgs/kennybop_sakuyahelp.png" alt="sakuyahelp by kennybop" onclick="openLightbox(this.src)">
          <span class="art-author">© kennybop</span>
        </div>

        <div class="gallery-item">
          <img src="../imgs/WRain_aya.png" alt="aya by WRain" onclick="openLightbox(this.src)">
          <span class="art-author">© WRain</span>
        </div>

        <div class="gallery-item">
          <img src="../imgs/WRain_sanae.jpg" alt="sanae by WRain" onclick="openLightbox(this.src)">
          <span class="art-author">© WRain</span>
        </div>

        <div class="gallery-item">
          <img src="../imgs/WRain_momoyo.png" alt="momoyo by WRain" onclick="openLightbox(this.src)">
          <span class="art-author">© WRain</span>
        </div>
        
        <div class="gallery-item">
          <img src="../imgs/Ink_reimu.png" alt="Reimu by Ink" onclick="openLightbox(this.src)">
          <span class="art-author">© WRain</span>
        </div>

      </div>
    </main>
  </div>

  <footer class="footer">
    <a href="https://discord.gg/XPkmejzgx" class="footer-icon" title="Discord"><i class="fa-brands fa-discord"></i></a>
    <a href="https://www.instagram.com/2humnclub" class="footer-icon" title="Instagram"><i
        class="fa-brands fa-instagram"></i></a>
    <a href="https://open.spotify.com/playlist/16VnuvSYcm5MkBt9EatOq9?si=581fd68eb5e04eec" class="footer-icon"
      title="Spotify"><i class="fa-brands fa-spotify"></i></a>
    <a href="mailto:2humn@tutanota.de" class="footer-icon" title="Email"><i class="fa-solid fa-envelope"></i></a>
  </footer>

</body>

</html>
